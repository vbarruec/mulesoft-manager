[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mulesoft-manager"
version = "1.0.0"
description = "Gestor normalizado de entornos MuleSoft para consultoras"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
gui = ["flask>=3.0.0"]

[project.scripts]
mulesoft-manager = "mulesoft_manager.cli:cli"
mulesoft-manager-gui = "start_gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mulesoft_manager*"]
